transport: streamable-http
host: "0.0.0.0"
port: 3000

services:
  omdb:
    api_key: "YOUR_OMDB_API_KEY_HERE"

  searxng:
    url: "http://searxng:8080"

auth_tokens:
  - token: "admin-GENERATE_WITH_openssl_rand_hex_32"
    description: "Admin"
    permissions:
      omdb: { actions: ["*"] }
      searxng: { actions: ["*"] }
