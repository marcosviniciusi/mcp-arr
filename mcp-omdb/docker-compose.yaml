services:
  mcp-omdb:
    image: marcosviniciusi/mcp-omdb:v4.3.0
    container_name: mcp-omdb
    restart: unless-stopped
    ports:
      - "3004:3000"
    environment:
      - MIDIA_MCP_CONFIG=/etc/midia-mcp/config.yaml
      - TRANSPORT=streamable-http
    volumes:
      - ./config.yaml:/etc/midia-mcp/config.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-omdb.rule=Host(`mcp-omdb.example.com`)"
      - "traefik.http.routers.mcp-omdb.entrypoints=websecure"
      - "traefik.http.routers.mcp-omdb.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp-omdb.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
