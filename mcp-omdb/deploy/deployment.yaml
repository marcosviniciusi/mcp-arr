apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-omdb
  namespace: mcp-arr
  labels:
    app.kubernetes.io/name: mcp-omdb
    app.kubernetes.io/part-of: mcp-arr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-omdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-omdb
        app.kubernetes.io/part-of: mcp-arr
    spec:
      containers:
        - name: mcp-omdb
          image: marcosviniciusi/mcp-omdb:v4.3.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: MIDIA_MCP_CONFIG
              value: /etc/midia-mcp/config.yaml
            - name: TRANSPORT
              value: streamable-http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            timeoutSeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /etc/midia-mcp
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: midia-mcp-config
