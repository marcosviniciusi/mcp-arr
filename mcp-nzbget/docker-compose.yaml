services:
  mcp-nzbget:
    image: marcosviniciusi/mcp-nzbget:v4.3.0
    container_name: mcp-nzbget
    restart: unless-stopped
    ports:
      - "3017:3000"
    environment:
      - MIDIA_MCP_CONFIG=/etc/midia-mcp/config.yaml
      - TRANSPORT=streamable-http
    volumes:
      - ./config.yaml:/etc/midia-mcp/config.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-nzbget.rule=Host(`mcp-nzbget.example.com`)"
      - "traefik.http.routers.mcp-nzbget.entrypoints=websecure"
      - "traefik.http.routers.mcp-nzbget.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp-nzbget.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
