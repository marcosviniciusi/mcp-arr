services:
  mcp-lidarr:
    image: marcosviniciusi/mcp-lidarr:v4.3.0
    container_name: mcp-lidarr
    restart: unless-stopped
    ports:
      - "3012:3000"
    environment:
      - MIDIA_MCP_CONFIG=/etc/midia-mcp/config.yaml
      - TRANSPORT=streamable-http
    volumes:
      - ./config.yaml:/etc/midia-mcp/config.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-lidarr.rule=Host(`mcp-lidarr.example.com`)"
      - "traefik.http.routers.mcp-lidarr.entrypoints=websecure"
      - "traefik.http.routers.mcp-lidarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp-lidarr.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
