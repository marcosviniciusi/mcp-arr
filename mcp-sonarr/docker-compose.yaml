services:
  mcp-sonarr:
    image: marcosviniciusi/mcp-sonarr:v4.3.0
    container_name: mcp-sonarr
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - MIDIA_MCP_CONFIG=/etc/midia-mcp/config.yaml
      - TRANSPORT=streamable-http
    volumes:
      - ./config.yaml:/etc/midia-mcp/config.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-sonarr.rule=Host(`mcp-sonarr.example.com`)"
      - "traefik.http.routers.mcp-sonarr.entrypoints=websecure"
      - "traefik.http.routers.mcp-sonarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp-sonarr.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
