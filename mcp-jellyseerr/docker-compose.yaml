services:
  mcp-jellyseerr:
    image: marcosviniciusi/mcp-jellyseerr:v4.3.0
    container_name: mcp-jellyseerr
    restart: unless-stopped
    ports:
      - "3015:3000"
    environment:
      - MIDIA_MCP_CONFIG=/etc/midia-mcp/config.yaml
      - TRANSPORT=streamable-http
    volumes:
      - ./config.yaml:/etc/midia-mcp/config.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-jellyseerr.rule=Host(`mcp-jellyseerr.example.com`)"
      - "traefik.http.routers.mcp-jellyseerr.entrypoints=websecure"
      - "traefik.http.routers.mcp-jellyseerr.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp-jellyseerr.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
