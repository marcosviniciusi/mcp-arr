# ============================================================================
# SealedSecret placeholder for midia-mcp config
# ============================================================================
# This file should be generated by scripts/seal-secrets.sh
# It contains the encrypted config.yaml with all credentials.
#
# Generate:
#   ./scripts/seal-secrets.sh --config tokens-production.yaml --fetch-cert
#
# The sealed-secrets controller will decrypt this into a K8s Secret
# named "midia-mcp-config" with key "config.yaml".
#
# DO NOT put real credentials here — use kubeseal to generate this file.
# ============================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: midia-mcp-config
  namespace: ia-mcp
  labels:
    app.kubernetes.io/name: midia-mcp
spec:
  encryptedData:
    config.yaml: "REPLACE_WITH_KUBESEAL_OUTPUT"
  template:
    metadata:
      name: midia-mcp-config
      namespace: ia-mcp
      labels:
        app.kubernetes.io/name: midia-mcp
    type: Opaque
