apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: midia-mcp
  namespace: mcp-arr
  labels:
    app.kubernetes.io/name: midia-mcp
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`mcp-arr.vinicima.com`)
      services:
        - name: midia-mcp
          port: 80
  tls:
    secretName: vinicima-com-tls
