apiVersion: apps/v1
kind: Deployment
metadata:
  name: midia-mcp
  namespace: mcp-arr
  labels:
    app.kubernetes.io/name: midia-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: midia-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: midia-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: midia-mcp
          image: marcosviniciusi/midia-mcp:v3.1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: MIDIA_MCP_CONFIG
              value: /etc/midia-mcp/config.yaml
            - name: TRANSPORT
              value: "streamable-http"
          volumeMounts:
            - name: config
              mountPath: /etc/midia-mcp
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          secret:
            secretName: midia-mcp-config
            items:
              - key: config.yaml
                path: config.yaml
