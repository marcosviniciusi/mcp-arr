services:
  mcp-mal:
    image: marcosviniciusi/mcp-mal:v4.3.0
    container_name: mcp-mal
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - MIDIA_MCP_CONFIG=/etc/midia-mcp/config.yaml
      - TRANSPORT=streamable-http
    volumes:
      - ./config.yaml:/etc/midia-mcp/config.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-mal.rule=Host(`mcp-mal.example.com`)"
      - "traefik.http.routers.mcp-mal.entrypoints=websecure"
      - "traefik.http.routers.mcp-mal.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp-mal.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
