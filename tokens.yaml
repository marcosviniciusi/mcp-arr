# ============================================================================
# midia-mcp — Configuration
# ============================================================================
# Copy this file to /etc/midia-mcp/config.yaml and adjust for your setup.
# In K8s, this is mounted as a Secret volume. Credentials stay in the cluster.
# Users only need the token + URL in their Claude Desktop config.

# Transport: "stdio" for local/CLI usage, "sse" for HTTP-based (recommended in K8s)
transport: sse
host: "0.0.0.0"
port: 3000

# ============================================================================
# OPENTELEMETRY
# ============================================================================
otel:
  enabled: true
  endpoint: "http://otel-collector.observability.svc:4318"
  service_name: "midia-mcp"

# ============================================================================
# SERVICES
# ============================================================================
# Configure only the services you use. Unconfigured services won't be available.

services:
  jellyseerr:
    url: "http://jellyseerr:5055"
    api_key: ""                      # Admin API key (Settings > General)
    users:
      poweruser:
        email: "poweruser@example.com"
        password: ""
      requester:
        email: "requester@example.com"
        password: ""

  sonarr:
    url: "http://sonarr:8989"
    api_key: ""

  radarr:
    url: "http://radarr:7878"
    api_key: ""

  prowlarr:
    url: "http://prowlarr:9696"
    api_key: ""

  qbittorrent:
    url: "http://qbittorrent:8080"
    username: "admin"
    password: ""

  nzbget:
    url: "http://nzbget:6789"
    username: "nzbget"
    password: ""

  emby:
    url: "http://emby:8096"
    api_key: ""

# ============================================================================
# AUTH TOKENS
# ============================================================================
# Each token has permissions scoped by app and action.
#
# Permission dimensions:
#   - App: which service the token can access (jellyseerr, sonarr, radarr, etc.)
#   - Actions: which operations within that app (["*"] for all)
#   - auth_level: (Jellyseerr only) which auth context to use
#
# If an app is NOT listed in permissions → zero access to it.
# Use ["*"] in actions to allow all operations for that app.
#
# Generate tokens with: openssl rand -hex 32
# Prefix with "sk-" for readability (optional).

auth_tokens: []
