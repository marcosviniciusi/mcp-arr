services:
  mcp-tvdb:
    image: marcosviniciusi/mcp-tvdb:v4.3.0
    container_name: mcp-tvdb
    restart: unless-stopped
    ports:
      - "3014:3000"
    environment:
      - MIDIA_MCP_CONFIG=/etc/midia-mcp/config.yaml
      - TRANSPORT=streamable-http
    volumes:
      - ./config.yaml:/etc/midia-mcp/config.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-tvdb.rule=Host(`mcp-tvdb.example.com`)"
      - "traefik.http.routers.mcp-tvdb.entrypoints=websecure"
      - "traefik.http.routers.mcp-tvdb.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp-tvdb.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
