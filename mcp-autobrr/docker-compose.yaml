services:
  mcp-autobrr:
    image: marcosviniciusi/mcp-autobrr:v4.3.0
    container_name: mcp-autobrr
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      - MIDIA_MCP_CONFIG=/etc/midia-mcp/config.yaml
      - TRANSPORT=streamable-http
    volumes:
      - ./config.yaml:/etc/midia-mcp/config.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-autobrr.rule=Host(`mcp-autobrr.example.com`)"
      - "traefik.http.routers.mcp-autobrr.entrypoints=websecure"
      - "traefik.http.routers.mcp-autobrr.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp-autobrr.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
