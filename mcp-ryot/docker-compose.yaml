services:
  mcp-ryot:
    image: marcosviniciusi/mcp-ryot:v4.3.0
    container_name: mcp-ryot
    restart: unless-stopped
    ports:
      - "3011:3000"
    environment:
      - MIDIA_MCP_CONFIG=/etc/midia-mcp/config.yaml
      - TRANSPORT=streamable-http
    volumes:
      - ./config.yaml:/etc/midia-mcp/config.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-ryot.rule=Host(`mcp-ryot.example.com`)"
      - "traefik.http.routers.mcp-ryot.entrypoints=websecure"
      - "traefik.http.routers.mcp-ryot.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp-ryot.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
