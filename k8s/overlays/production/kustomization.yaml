apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ia-mcp

resources:
  - ../../base

images:
  - name: midia-mcp
    newName: your-registry.com/midia-mcp
    newTag: latest

patches:
  - target:
      kind: Ingress
      name: midia-mcp
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: midia-mcp.your-domain.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: midia-mcp.your-domain.com
      - op: replace
        path: /spec/tls/0/secretName
        value: midia-mcp-tls-prod
  - target:
      kind: Deployment
      name: midia-mcp
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
