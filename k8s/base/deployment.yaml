apiVersion: apps/v1
kind: Deployment
metadata:
  name: midia-mcp
  namespace: ia-mcp
  labels:
    app.kubernetes.io/name: midia-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: midia-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: midia-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: midia-mcp
          image: midia-mcp:latest
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: midia-mcp-config
            - secretRef:
                name: midia-mcp-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
