apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: midia-mcp
  namespace: ia-mcp
  labels:
    app.kubernetes.io/name: midia-mcp
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # SSE requires these for long-lived connections
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-cache: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: midia-mcp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: midia-mcp
                port:
                  name: http
  tls:
    - hosts:
        - midia-mcp.example.com
      secretName: midia-mcp-tls
