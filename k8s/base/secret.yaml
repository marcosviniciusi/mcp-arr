apiVersion: v1
kind: Secret
metadata:
  name: midia-mcp-secrets
  namespace: ia-mcp
  labels:
    app.kubernetes.io/name: midia-mcp
type: Opaque
stringData:
  # RBAC token config — JSON array with token, name, and role per user
  # Roles: admin (full access), manager (read+write), viewer (read-only)
  # Generate tokens with: openssl rand -hex 32
  AUTH_TOKENS_CONFIG: |
    [
      {"token": "CHANGE_ME_GENERATE_TOKEN_1", "name": "admin-user", "role": "admin"},
      {"token": "CHANGE_ME_GENERATE_TOKEN_2", "name": "manager-user", "role": "manager"},
      {"token": "CHANGE_ME_GENERATE_TOKEN_3", "name": "viewer-user", "role": "viewer"}
    ]
  # *arr API keys
  SONARR_API_KEY: "CHANGE_ME"
  RADARR_API_KEY: "CHANGE_ME"
  PROWLARR_API_KEY: "CHANGE_ME"
  # qBittorrent credentials
  QBITTORRENT_USERNAME: "admin"
  QBITTORRENT_PASSWORD: "CHANGE_ME"
  # NZBGet credentials
  NZBGET_USERNAME: "nzbget"
  NZBGET_PASSWORD: "CHANGE_ME"
  # Emby
  EMBY_API_KEY: "CHANGE_ME"
