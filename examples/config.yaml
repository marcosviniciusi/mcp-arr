# ============================================================================
# midia-mcp v3.1 — Example Configuration
# ============================================================================
# Full example with all 16 service instances and token profiles.
# Copy and adjust for your setup.

transport: sse                          # stdio | sse | streamable-http
host: "0.0.0.0"
port: 3000

# ============================================================================
# OPENTELEMETRY
# ============================================================================
otel:
  enabled: true
  endpoint: "http://otel-collector.observability.svc:4318"
  service_name: "midia-mcp"

# ============================================================================
# SERVICES — 16 instances across 13 service types
# ============================================================================

services:
  # ── *arr Stack (multi-instance supported) ──────────────────────
  sonarr:
    url: "http://sonarr.arr.svc:8989"
    api_key: "your-sonarr-api-key"

  sonarr_animes:
    url: "http://sonarr-animes.arr.svc:8989"
    api_key: "your-sonarr-animes-api-key"

  radarr:
    url: "http://radarr.arr.svc:7878"
    api_key: "your-radarr-api-key"

  radarr_animes:
    url: "http://radarr-animes.arr.svc:7878"
    api_key: "your-radarr-animes-api-key"

  prowlarr:
    url: "http://prowlarr.arr.svc:9696"
    api_key: "your-prowlarr-api-key"

  lidarr:
    url: "http://lidarr.arr.svc:8686"
    api_key: "your-lidarr-api-key"

  whisparr:
    url: "http://whisparr.arr.svc:6969"
    api_key: "your-whisparr-api-key"

  # ── Subtitles (multi-instance supported) ───────────────────────
  bazarr:
    url: "http://bazarr.arr.svc:6767"
    api_key: "your-bazarr-api-key"

  bazarr_animes:
    url: "http://bazarr-animes.arr.svc:6767"
    api_key: "your-bazarr-animes-api-key"

  # ── Torrent Automation ─────────────────────────────────────────
  autobrr:
    url: "http://autobrr.arr.svc:7474"
    api_key: "your-autobrr-api-token"

  # ── Media Servers ──────────────────────────────────────────────
  emby:
    url: "http://emby.jelly.svc:8096"
    api_key: "your-emby-api-key"

  jellyfin:
    url: "http://jellyfin.jelly.svc:8096"
    api_key: "your-jellyfin-api-key"

  # ── Request Managers ───────────────────────────────────────────
  seerr:
    url: "http://overseerr.jelly.svc:5055"
    api_key: "your-seerr-api-key"
    users:
      vinicima:
        email: "vinicima"
        password: "your-seerr-password"

  # jellyseerr:                            # uncomment if using jellyseerr
  #   url: "http://jellyseerr.jelly.svc:5055"
  #   api_key: "your-jellyseerr-api-key"
  #   users:
  #     poweruser:
  #       email: "user@example.com"
  #       password: "password"

  # ── External Databases ─────────────────────────────────────────
  tmdb:
    api_key: "your-tmdb-v4-read-access-token"

  mal:
    client_id: "your-mal-client-id"
    # access_token: "your-mal-oauth2-token"  # optional, for user lists

  # ── Media Tracking ─────────────────────────────────────────────
  ryot:
    url: "http://ryot.arr.svc:8000"
    api_token: "your-ryot-api-token"

  # ── Download Clients (uncomment if using) ──────────────────────
  # qbittorrent:
  #   url: "http://qbittorrent.arr.svc:8080"
  #   username: "admin"
  #   password: "your-qbittorrent-password"

  # nzbget:
  #   url: "http://nzbget.arr.svc:6789"
  #   username: "nzbget"
  #   password: "your-nzbget-password"

# ============================================================================
# AUTH TOKENS
# ============================================================================
# Permission features:
#   actions: ["*"]              → all actions for the app
#   actions: ["@read"]          → category expansion (all read actions)
#   actions: ["get_*"]          → glob pattern match
#   deny_actions: ["delete_*"]  → blocklist (overrides allowlist)
#   auth_level: admin|user      → Seerr/Jellyseerr auth context
#
# Categories per service:
#   sonarr/radarr/lidarr: @read, @search, @manage
#   prowlarr:             @read, @search, @manage
#   whisparr:             @read, @search, @manage
#   bazarr:               @read, @manage, @delete
#   autobrr:              @read, @manage
#   jellyfin/emby:        @read, @playback, @manage, @admin
#   seerr/jellyseerr:     @read, @request, @manage, @admin
#   qbittorrent:          @read, @manage, @config
#   nzbget:               @read, @manage, @config
#   tmdb:                 @read, @search, @discover, @rate
#   mal:                  @read, @search, @list, @manage
#   ryot:                 @read, @search, @track, @manage
#
# Generate tokens: openssl rand -hex 32 | sed 's/^/admin-/'

auth_tokens:
  # ── Platform Admin — full access to all instances ──────────────
  - token: "admin-YOUR_GENERATED_TOKEN_HERE"
    description: "Platform Admin - full access"
    permissions:
      sonarr: { actions: ["*"] }
      sonarr_animes: { actions: ["*"] }
      radarr: { actions: ["*"] }
      radarr_animes: { actions: ["*"] }
      prowlarr: { actions: ["*"] }
      lidarr: { actions: ["*"] }
      whisparr: { actions: ["*"] }
      bazarr: { actions: ["*"] }
      bazarr_animes: { actions: ["*"] }
      autobrr: { actions: ["*"] }
      emby: { actions: ["*"] }
      jellyfin: { actions: ["*"] }
      seerr: { actions: ["*"], auth_level: admin }
      tmdb: { actions: ["*"] }
      mal: { actions: ["*"] }
      ryot: { actions: ["*"] }

  # ── Read-only monitoring ───────────────────────────────────────
  - token: "mon-YOUR_GENERATED_TOKEN_HERE"
    description: "Monitoring - read-only"
    permissions:
      sonarr: { actions: ["@read"] }
      radarr: { actions: ["@read"] }
      prowlarr: { actions: ["@read"] }
      lidarr: { actions: ["@read"] }
      emby: { actions: ["@read"] }
      jellyfin: { actions: ["@read"] }
      ryot: { actions: ["@read"] }

  # ── Media consumer — browse + request, no manage ───────────────
  - token: "user-YOUR_GENERATED_TOKEN_HERE"
    description: "Media Consumer"
    permissions:
      seerr: { actions: ["@read", "@request"], auth_level: user }
      tmdb: { actions: ["@read", "@search", "@discover"] }
      mal: { actions: ["@read", "@search", "@list"] }
      ryot: { actions: ["@read", "@search", "@track"] }
      emby: { actions: ["@read", "@playback"] }
      jellyfin: { actions: ["@read", "@playback"] }
