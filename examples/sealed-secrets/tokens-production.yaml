# ============================================================================
# midia-mcp — Production Token Config
# ============================================================================
# Used with seal-secrets.sh to generate SealedSecrets for production.
# DO NOT commit this file with real tokens — use kubeseal first.
#
# Steps:
#   1. Fill in real API keys and tokens below
#   2. Run: ./scripts/seal-secrets.sh --config tokens-production.yaml
#   3. Apply: kubectl apply -f deploy/sealedsecret-config.yaml
#   4. Delete this file (or keep outside of git)

transport: sse
host: "0.0.0.0"
port: 3000

otel:
  enabled: true
  endpoint: "http://signoz-otel-collector.observability.svc.cluster.local:4318"
  service_name: "midia-mcp"

services:
  jellyseerr:
    url: "http://jellyseerr.media.svc.cluster.local:5055"
    api_key: "REPLACE_WITH_REAL_KEY"
    users:
      poweruser:
        email: "poweruser@home.local"
        password: "REPLACE_WITH_REAL_PASSWORD"
      requester:
        email: "requester@home.local"
        password: "REPLACE_WITH_REAL_PASSWORD"

  sonarr:
    url: "http://sonarr.media.svc.cluster.local:8989"
    api_key: "REPLACE_WITH_REAL_KEY"

  radarr:
    url: "http://radarr.media.svc.cluster.local:7878"
    api_key: "REPLACE_WITH_REAL_KEY"

  prowlarr:
    url: "http://prowlarr.media.svc.cluster.local:9696"
    api_key: "REPLACE_WITH_REAL_KEY"

  qbittorrent:
    url: "http://qbittorrent.media.svc.cluster.local:8080"
    username: "admin"
    password: "REPLACE_WITH_REAL_PASSWORD"

  nzbget:
    url: "http://nzbget.media.svc.cluster.local:6789"
    username: "nzbget"
    password: "REPLACE_WITH_REAL_PASSWORD"

  emby:
    url: "http://emby.media.svc.cluster.local:8096"
    api_key: "REPLACE_WITH_REAL_KEY"

auth_tokens:
  - token: "GENERATE_WITH_openssl_rand_-hex_32"
    description: "Platform Admin"
    permissions:
      jellyseerr: { actions: ["*"], auth_level: admin }
      sonarr: { actions: ["*"] }
      radarr: { actions: ["*"] }
      prowlarr: { actions: ["*"] }
      qbittorrent: { actions: ["*"] }
      nzbget: { actions: ["*"] }
      emby: { actions: ["*"] }

  - token: "GENERATE_WITH_openssl_rand_-hex_32"
    description: "Power User"
    permissions:
      jellyseerr: { actions: ["search", "request", "get_requests", "get_media", "get_status"], auth_level: poweruser }
      emby: { actions: ["search", "get_movies", "get_series", "get_libraries"] }

  - token: "GENERATE_WITH_openssl_rand_-hex_32"
    description: "Regular User"
    permissions:
      jellyseerr: { actions: ["search", "request", "get_requests"], auth_level: requester }
      emby: { actions: ["search", "get_movies", "get_series"] }
