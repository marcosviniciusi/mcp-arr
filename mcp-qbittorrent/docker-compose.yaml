services:
  mcp-qbittorrent:
    image: marcosviniciusi/mcp-qbittorrent:v4.3.0
    container_name: mcp-qbittorrent
    restart: unless-stopped
    ports:
      - "3016:3000"
    environment:
      - MIDIA_MCP_CONFIG=/etc/midia-mcp/config.yaml
      - TRANSPORT=streamable-http
    volumes:
      - ./config.yaml:/etc/midia-mcp/config.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-qbittorrent.rule=Host(`mcp-qbittorrent.example.com`)"
      - "traefik.http.routers.mcp-qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.mcp-qbittorrent.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp-qbittorrent.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
